<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricbook</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    
    <header class="header">
        <p class="header__title">Cricbook</p>
    </header>
    
    <main class="main">
        
        <section class="search">
            <input class="search__input" type="text" id="player-search" placeholder="Search player">
            <button class="search__button--clear button--primary">Clear</button>
        </section>

        <div class="spinner hidden"></div>

        <div class="search__result"></div>

        <section class="IPL-players">
            <div class="IPL-players__header">
                <h2>IPL Players</h2>
                <div class="filters-and-sorting">
                    <div class="filters">
                        <p>Filter by:<p>
                        <select class="position dropdown" name="position">
                            <option value="all">-position-</option>
                            <option value="Batsman">Batsman</option>
                            <option value="Pace Bowler">Pace Bowler</option>
                            <option value="Wicket Keeper">Wicket keeper</option>
                            <option value="All-Rounder">All rounder</option>
                        </select>
                        <select class="nationality dropdown" name="nationality">
                            <option value="all">-nationality-</option>
                            <option value="India">India</option>
                            <option value="Australia">Australia</option>
                            <option value="New Zealand">New Zealand</option>
                            <option value="Pakistan">Pakistan</option>
                            <option value="South Africa">South Africa</option>
                            <option value="Sri Lanka">Sri Lanka</option>
                            <option value="West Indies">West Indies</option>
                        </select>
                    </div>
                    <div class="sort">
                        <p>Sort by:</p>
                        <button class="sort--ascending button--primary">A - Z</button>
                        <button class="sort--descending button--primary">Z - A</button>
                    </div>
                </div>
            </div>
            <div class="IPL-players__list"></div>
            <section class="fav">
                <h2>Favourites</h2>
                <div class="fav__list"></div>
            </section>
        </section>

        <div class="modal hidden">
            <button class="modal__close button--primary">Close</button>
            <div class="modal__content">
                <div class="modal__upper-half">
                    <div class="modal__biodata">
                        <p class="modal__name"></p>
                        <p class="modal__nationality"></p>
                        <p class="modal__dob"></p>
                        <p class="modal__pob"></p>
                        <p class="modal__gender"></p>
                        <p class="modal__ethnicity"></p>
                        <p class="modal__height"></p>
                        <p class="modal__sport"></p>
                        <p class="modal__team"></p>
                        <p class="modal__IPLTeam"></p>
                        <p class="modal__position"></p>
                        <p class="modal__side"></p>
                        <p class="modal__status"></p>
                    </div>
                    <img class="modal__image" src="" alt="">
                </div>
                <p class="modal__description"></p>
            </div>
        </div>
    
    </main>
    
    <footer class="footer">
        <p>Made with ❤️ by 
            <a class="footer__link" href="https://rishiverma.netlify.app/">Rishi Verma</a>
        </p>
    </footer>
    
    <script type="module" src="./scripts/main.js"></script>

</body>
</html>
